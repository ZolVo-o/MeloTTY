[package]
name = "melotty"
version = "0.4.0"
edition = "2021"
description = "A focused terminal music player with album art"
authors = ["ZolVo-o <valentinebezugliy028@gmail.com>"]
license = "Apache-2.0"

[dependencies]
rodio = "0.19"
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
image = "0.25"
symphonia = { version = "0.5", features = ["all"] }
