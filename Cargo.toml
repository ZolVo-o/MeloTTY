[package]
name = "termusic"
version = "0.3.0"
edition = "2021"
description = "High-quality terminal music player"
authors = ["zolvo"]
license = "MIT"

[dependencies]
rodio = "0.19"
ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
